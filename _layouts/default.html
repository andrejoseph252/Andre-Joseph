<html>
<head>
    <title>{{ page.title }}</title>
    <meta charset='UTF-8'>
    <meta content='width=device-width, initial-scale=1' name='viewport'/>

    <meta name='description' content='Blank'>
    <meta name='keywords' content='{{ page.keywords }}'>
    <meta name='author' content='Andre Joseph'>

    <link href='{{ site.baseurl }}/css/blog.css' rel='stylesheet'/>
    <link href='{{ site.baseurl }}/css/trac.css' rel='stylesheet'/>
    <link href='{{ site.baseurl }}/css/markdown.css' rel='stylesheet'/>
    {% if page.viz %}<link href='{{ site.baseurl }}/css/viz.css' rel='stylesheet'/>{% endif %}

    {% include mathjax.html %}
</head>
<body>
<div class='content'>
    {% include nav.html %}
    <div class='front-matter'>
        <div class='wrap'>
            <h1>{{ page.title }}</h1>
            <h4>{{ page.subtitle }}</h4>
            <div class='bylines'>
                <div class='byline'>
                    <h3>Published</h3>
                    <p>{{ page.date |  date: '%d %B %Y' }}</p>
                </div>
            </div>
            <div class='clear'></div>
        </div>
    </div>
    <div class='wrap article'>
        {{ content }}
    </div>
    <div id='bibliography'>
        <div class='wrap'>
            {% bibliography --cited %}
        </div>
    </div>
</div>
{% if page.viz %}
    <script src='https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js'></script>
    <script src='{{ site.baseurl }}/assets/viz/viz-core.js'></script>
    {% for v in page.viz %}
    <script src='{{ site.baseurl }}/assets/viz/{{ v }}.js'></script>
    {% endfor %}
    <script>window.VizRegistry && window.VizRegistry.boot();</script>
{% endif %}
</body>
</html>
